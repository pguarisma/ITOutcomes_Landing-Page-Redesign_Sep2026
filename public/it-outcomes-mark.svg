<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 320" width="100%" height="100%">
  <defs>
    <filter id="markRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#markRedGlow)">
    <!-- 1. Central Hero Arrow -->
    <path 
      d="M 175 22
         L 230 92
         H 199
         V 175
         L 151 212
         V 92
         H 120
         Z" 
      fill="#ff3b4e" 
    />

    <!-- 2. Top-Left Node (Rounded Square) -->
    <rect 
      x="45" 
      y="104" 
      width="52" 
      height="52" 
      rx="8" 
      fill="none" 
      stroke="#ff3b4e" 
      stroke-width="11" 
      stroke-linejoin="round"
    />

    <!-- Top-Left Connector with Arrowhead -->
    <line 
      x1="97" 
      y1="130" 
      x2="130" 
      y2="130" 
      stroke="#ff3b4e" 
      stroke-width="11" 
      stroke-linecap="round" 
    />
    <polygon 
      points="125,116 147,130 125,144" 
      fill="#ff3b4e" 
    />

    <!-- 3. Bottom-Left Node (Rounded Square) -->
    <rect 
      x="45" 
      y="234" 
      width="52" 
      height="52" 
      rx="8" 
      fill="none" 
      stroke="#ff3b4e" 
      stroke-width="11" 
      stroke-linejoin="round"
    />

    <!-- 4. Right Intermediate Node (Rounded Square) -->
    <rect 
      x="227" 
      y="162" 
      width="52" 
      height="52" 
      rx="8" 
      fill="none" 
      stroke="#ff3b4e" 
      stroke-width="11" 
      stroke-linejoin="round"
    />

    <!-- 5. Bus Architecture Interconnect -->
    <!-- Horizontal trunk from bottom-left node to right node corner -->
    <path 
      d="M 97 260 
         H 242 
         A 11 11 0 0 0 253 249 
         V 214" 
      fill="none" 
      stroke="#ff3b4e" 
      stroke-width="11" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Vertical Feeder Branch up into Central Arrow Cut -->
    <line 
      x1="175" 
      y1="260" 
      x2="175" 
      y2="215" 
      stroke="#ff3b4e" 
      stroke-width="11" 
      stroke-linecap="round" 
    />

    <!-- Inline Arrowhead on Horizontal Line -->
    <polygon 
      points="201,248 223,260 201,272" 
      fill="#ff3b4e" 
    />
  </g>
</svg>
